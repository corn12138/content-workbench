name: Checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - run: $(go env GOPATH)/bin/gitleaks git . --log-opts='--all --full-history' --redact --ignore-gitleaks-allow --max-archive-depth 2 --no-banner
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: rustup update stable --no-self-update && rustup default stable
      - run: npm ci
      - run: npm run audit:source
      - run: npm run typecheck
      - run: npm test
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: npm run test:parity
      - run: npm run build -- -- --locked
      - run: npm audit --audit-level=high
